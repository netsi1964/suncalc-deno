<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mørk baggrund for ikonet -->
  <rect width="512" height="512" rx="112" fill="#1E293B"/>
  
  <defs>
    <!-- Maske for at skabe en halvmåne -->
    <mask id="moon-cutout">
      <rect width="512" height="512" fill="white"/>
      <circle cx="280" cy="220" r="48" fill="black"/>
    </mask>
  </defs>

  <!-- Selve App-vinduet -->
  <rect x="80" y="112" width="352" height="288" rx="16" fill="#0F172A" stroke="#334155" stroke-width="6"/>
  
  <!-- Native OS vindues-knapper (macOS stil) -->
  <circle cx="110" cy="140" r="8" fill="#EF4444"/>
  <circle cx="135" cy="140" r="8" fill="#EAB308"/>
  <circle cx="160" cy="140" r="8" fill="#22C55E"/>
  
  <!-- Linje under headeren -->
  <line x1="80" y1="168" x2="432" y2="168" stroke="#334155" stroke-width="4"/>

  <!-- Solen -->
  <circle cx="210" cy="280" r="60" fill="#FBBF24"/>
  
  <!-- Månen -->
  <circle cx="310" cy="250" r="56" fill="#E2E8F0" mask="url(#moon-cutout)"/>
</svg>